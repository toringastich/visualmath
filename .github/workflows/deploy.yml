name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the built landing page to the gh-pages branch, which GitHub Pages
# serves automatically (auto-enabled when the branch first appears).
#
# Only apps/landing/dist is published, and that is a constraint rather than an
# omission: one Pages site takes one custom domain, and apps/warp/public/CNAME
# asks for a different one than apps/landing/public/CNAME. Publishing both into
# this branch would let whichever CNAME landed at the root decide the domain for
# both sites. apps/lessons is likewise absent -- its judged SoME URL is served
# by the standalone warp-lessons repo until Aug 31.
#
# Nothing here names an owner: ${GITHUB_REPOSITORY} and the built-in token both
# follow the repo, so the transfer to the secantlabs org needs no edit.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: touch apps/landing/dist/.nojekyll
      - name: Publish dist to gh-pages
        run: |
          cd apps/landing/dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
